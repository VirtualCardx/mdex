[package]
name = "mdex"
version = "0.1.0"
description = "Desktop markdown editor for the mdex document format"
edition = "2021"

[lib]
name = "mdex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
percent-encoding = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
